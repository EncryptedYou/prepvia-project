<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#111111"><title>Prepvia — Reset Password</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./src/auth.css"></head><body><main class="auth-shell single"><section class="auth-panel"><div class="mobile-brand"><div class="brand-mark"><span>p</span> prepvia</div></div><a class="back-link" href="./auth.html"><i data-lucide="arrow-left"></i><span>Back to sign in</span></a><div class="auth-card"><div class="heading"><div class="welcome-icon">🔐</div><div class="eyebrow dark">ACCOUNT RECOVERY</div><h1>Reset your password</h1><p>Choose a new password for your Prepvia account.</p></div><div class="message" id="message" role="alert"></div><form id="resetForm"><div class="field"><label for="password">New password</label><div class="input-wrap"><i data-lucide="lock-keyhole"></i><input id="password" type="password" minlength="8" placeholder="Minimum 8 characters" required></div></div><div class="field"><label for="confirm">Confirm new password</label><div class="input-wrap"><i data-lucide="shield-check"></i><input id="confirm" type="password" minlength="8" placeholder="Re-enter your password" required></div></div><button class="primary-button" type="submit" id="submitButton"><span>Update password</span><i data-lucide="check"></i></button></form></div></section></main><script type="module" src="./src/reset.js"></script></body></html>
